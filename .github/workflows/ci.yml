# Free checks on every push and pull request (REQUIREMENTS.md §6). No secrets.
# check: lint, types, unit tests, build. integration: the Compose stack built
# from catalog-api v1.1.0, and the *.int.test.ts files against it. Whether
# integration stays on every pull request is decided at M4, once its run time
# on GitHub is known. The real-model evals (manual only) arrive in M7.
name: CI

# push is limited to main and tags, so a pull request from a branch in this
# repo runs once (as pull_request), not twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  integration:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # OpenSearch's documented minimum for Docker hosts.
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: docker compose up --build -d --wait
      # The 10,000 seed products and a reindex, as in the README: the stdio
      # tests search the seed's books. The admin dev key is public (not a secret).
      - run: docker compose run --rm -e CATALOG_API_URL=http://catalog-api:3000 -e CATALOG_API_KEY=dev-admin-key-not-secret-000000000000000 catalog-api node dist/seed/main.js
      - run: npm run test:int
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 200
